<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公立幼兒園教保服務品質滿意度分析工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 解析) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- Chart.js (雷達圖) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js (匯出 PDF/PNG) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- html2canvas (備用匯出 PNG) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { background-color: #f3f4f6; }
        /* 強制 PDF 分頁樣式 */
        .pdf-page-break { page-break-before: always; }
        /* 拖曳上傳區的互動效果 */
        .dragover { background-color: #eff6ff !important; border-color: #3b82f6 !important; }
    </style>
</head>
<body class="p-6">

<div class="max-w-4xl mx-auto space-y-6">
    <!-- 頂部標題與上傳區 -->
    <div class="bg-white p-6 rounded-lg shadow-md text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">教保服務品質滿意度 (25題核心版) 自動分析工具</h1>
        
        <!-- 拖曳上傳區塊 -->
        <div id="dropZone" class="border-2 border-dashed border-gray-300 bg-gray-50 transition-colors rounded-lg p-10 flex flex-col items-center justify-center">
            <svg class="w-12 h-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-gray-600 mb-4 font-medium">請點擊下方按鈕，或將 Excel/CSV 檔案拖曳至此虛線框內</p>
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                <span>選擇檔案並自動分析</span>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden" />
            </label>
            <p id="fileName" class="mt-4 text-sm text-blue-600 font-bold hidden"></p>
        </div>
    </div>

    <!-- 操作按鈕區 (分析後顯示) -->
    <div id="actionArea" class="hidden flex justify-end gap-3">
        <button onclick="downloadCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow">
            下載數據 CSV
        </button>
        <button onclick="openExportModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded shadow">
            匯出圖文報表 (PDF/PNG)
        </button>
    </div>

    <!-- 報表預覽區塊 -->
    <div id="reportContainer" class="bg-white p-8 rounded-lg shadow-md hidden">
        <div id="exportContent" class="bg-white">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-8" id="reportTitle">服務品質滿意度分析報告</h2>
            
            <!-- ================= 區塊 1：雷達圖 ================= -->
            <div id="section-radar" class="mb-10 flex justify-center items-center flex-col">
                <h3 class="text-xl font-bold text-gray-700 mb-4">五大構面平均得分雷達圖</h3>
                <div class="w-full max-w-lg">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <!-- ================= 區塊 2：前兩個構面 ================= -->
            <div id="section-scores-1">
                <h3 class="text-xl font-bold text-gray-700 mb-4 pb-2 border-b-2 border-blue-500">各構面與逐題平均得分</h3>
                <div id="dims-page-1" class="space-y-6"></div>
            </div>

            <!-- ================= 區塊 3：後三個構面 ================= -->
            <div id="section-scores-2" class="mt-8">
                <div id="dims-page-2" class="space-y-6"></div>
            </div>
        </div>
    </div>
</div>

<!-- 匯出選項 Modal -->
<div id="exportModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96">
        <h3 class="text-xl font-bold mb-4">請選擇報表匯出內容</h3>
        <div class="space-y-3 mb-6">
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="checkRadar" checked class="form-checkbox h-5 w-5 text-blue-600">
                <span class="text-gray-700">五大構面雷達圖</span>
            </label>
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="checkScores" checked class="form-checkbox h-5 w-5 text-blue-600">
                <span class="text-gray-700">各構面與逐題分數</span>
            </label>
        </div>
        <div class="flex justify-end gap-3 border-t pt-4">
            <button onclick="closeExportModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded">取消</button>
            <button onclick="executeExport('png')" class="px-4 py-2 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded">下載 PNG</button>
            <button onclick="executeExport('pdf')" class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded shadow">下載 PDF</button>
        </div>
    </div>
</div>

<script>
    // 定義 25 題的標準顯示文字與其對應的題號 (1~25)
    // 我們將使用題號去抓取表單資料，但畫面呈現時仍會印出此處定義的漂亮標準字串
    const dimensionsConfig = [
        {
            name: "可靠性",
            questions: [
                { qNum: 1, text: "幼兒園師資穩定且流動率低。" },
                { qNum: 2, text: "幼兒園重視孩子的生活教育與生活自理能力，並落實於教學中。" },
                { qNum: 3, text: "我能很明顯地感受到孩子在幼兒園的學習進步。" },
                { qNum: 4, text: "幼兒園推動幼小銜接活動，有助於幼兒日後順利銜接國小學習。" },
                { qNum: 5, text: "我覺得幼兒園的教保品質很好，優於其他類型的幼兒園。" }
            ]
        },
        {
            name: "保證性",
            questions: [
                { qNum: 6, text: "老師具備專業的幼教知能與教保能力。" },
                { qNum: 7, text: "孩子的班級老師間互動與合作默契良好。" },
                { qNum: 8, text: "老師能運用多元創新的教學方法引發孩子學習興趣。" },
                { qNum: 9, text: "幼兒園提供的午餐與點心符合均衡營養原則。" },
                { qNum: 10, text: "國小校長/園長能熟悉且能充分掌握幼兒園的運作現況。" }
            ]
        },
        {
            name: "有形性",
            questions: [
                { qNum: 11, text: "幼兒園能為孩子留存完整的學習歷程記錄（如成長檔案、學習單、照片）。" },
                { qNum: 12, text: "幼兒園的環境能保持整潔，讓幼兒感到舒適。" },
                { qNum: 13, text: "幼兒園提供幼兒充足的活動與探索空間。" },
                { qNum: 14, text: "幼兒園的環境與設施設備能有安全防護，讓我感到安心。" },
                { qNum: 15, text: "幼兒園能適時更新或汰換教具與設備。" }
            ]
        },
        {
            name: "同理性",
            questions: [
                { qNum: 16, text: "幼兒園的學習內容豐富，符合孩子的需要。" },
                { qNum: 17, text: "幼兒園能規劃適切的戶外教學活動，豐富幼兒的學習與探索。" },
                { qNum: 18, text: "老師能提供充足的合作學習機會，鼓勵孩子發展社交技巧與合作能力。" },
                { qNum: 19, text: "幼兒園能規劃溫馨的家長接送環境，讓我在接送孩子時感受到被重視與關懷。" },
                { qNum: 20, text: "幼兒園的延長照顧服務時間（含課後、寒暑假）安排合宜，能減輕我的教保負擔。" }
            ]
        },
        {
            name: "反應性",
            questions: [
                { qNum: 21, text: "幼兒園能提供充分且多元的親師聯繫管道（如官方公務信箱、LINE、電話、面談）。" },
                { qNum: 22, text: "幼兒園能積極連結並善用社區資源（如圖書館、公園、超商等）。" },
                { qNum: 23, text: "幼兒園規劃的上學及放學接送流程順暢且便利。" },
                { qNum: 24, text: "幼兒園能即時透過網站或社群媒體（如FB、LINE）更新園務資訊。" },
                { qNum: 25, text: "幼兒園教職員工對於我提出的問題或需求，能提供有效且快速的回應。" }
            ]
        }
    ];

    let globalResults = []; 
    let myChart = null; 

    function processFile(file) {
        if (!file) return;

        document.getElementById('fileName').textContent = "已成功載入：" + file.name;
        document.getElementById('fileName').classList.remove('hidden');

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            analyzeData(jsonData);
        };
        reader.readAsArrayBuffer(file);
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        processFile(e.target.files[0]);
    });

    const dropZone = document.getElementById('dropZone');
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            const validExtensions = ['xlsx', 'xls', 'csv'];
            const fileExtension = file.name.split('.').pop().toLowerCase();
            
            if (validExtensions.includes(fileExtension)) {
                processFile(file);
            } else {
                alert("請上傳正確的 Excel (.xlsx) 或 CSV 檔案格式！");
            }
        }
    });

    function analyzeData(data) {
        if (data.length < 2) {
            alert('檔案內容為空或格式錯誤！');
            return;
        }

        const headers = data[0];
        const rows = data.slice(1);
        let results = [];
        let radarScores = [];

        // 清空現有報表
        document.getElementById('dims-page-1').innerHTML = '';
        document.getElementById('dims-page-2').innerHTML = '';

        // 建立「題號對應到欄位 Index」的對照表
        // 我們要過濾掉基本資料題，只抓取 "數字." 或 "數字 " 開頭的欄位，且數字介於 1~25 之間
        let questionColMap = {};
        
        // 要排除的干擾關鍵字 (避免有些園所自己加題號但不是滿意度題目)
        const excludeKeywords = ["最高學歷", "子女數", "2歲前", "送托", "行政區", "曾就讀", "哪些管道", "了解幼兒園"];

        headers.forEach((headerStr, colIdx) => {
            if (typeof headerStr !== 'string') return;
            
            // 如果欄位名稱包含排除關鍵字，直接跳過
            if (excludeKeywords.some(kw => headerStr.includes(kw))) return;

            // 使用正則表達式嘗試抓取開頭的數字 (例如 "1.", "1 ", "1．", "1、")
            const match = headerStr.trim().match(/^(\d+)[\.\s、．]/);
            if (match) {
                const qNum = parseInt(match[1], 10);
                // 確保只抓取 1 ~ 25 題，不理會 25 題之後的擴充題
                if (qNum >= 1 && qNum <= 25) {
                    questionColMap[qNum] = colIdx;
                }
            }
        });

        // 檢查是否至少抓到一些題目，如果都沒抓到可能表單連題號都沒打
        if (Object.keys(questionColMap).length === 0) {
            alert("無法在表單表頭中辨識到「1. ~ 25.」的題號格式，請確認匯出格式是否正確。");
            return;
        }

        dimensionsConfig.forEach((dim, dimIndex) => {
            let dimTotalScore = 0;
            let dimValidCount = 0;
            let questionsData = [];

            dim.questions.forEach(qDef => {
                let colIndex = questionColMap[qDef.qNum];
                
                let qAvg = 0;
                // 只有在表頭有找到這題時才計算
                if (colIndex !== undefined && colIndex !== -1) {
                    let sum = 0;
                    let count = 0;
                    rows.forEach(row => {
                        let val = parseFloat(row[colIndex]);
                        if (!isNaN(val) && val >= 1 && val <= 5) {
                            sum += val;
                            count++;
                        }
                    });
                    if (count > 0) {
                        qAvg = sum / count;
                        dimTotalScore += sum;
                        dimValidCount += count;
                    }
                }

                questionsData.push({
                    qNum: qDef.qNum,
                    text: qDef.text,
                    score: qAvg > 0 ? qAvg.toFixed(2) : '無數據'
                });
            });

            let dimAvg = dimValidCount > 0 ? (dimTotalScore / dimValidCount).toFixed(2) : 0;
            radarScores.push(dimAvg);

            results.push({
                dimension: dim.name,
                avg: dimAvg,
                questions: questionsData
            });

            renderDimensionGroup(dim.name, dimAvg, questionsData, dimIndex);
        });

        globalResults = results;
        document.getElementById('reportContainer').classList.remove('hidden');
        document.getElementById('actionArea').classList.remove('hidden');
        
        drawRadarChart(radarScores);
    }

    function renderDimensionGroup(dimName, dimAvg, questionsData, dimIndex) {
        let qHtml = questionsData.map(q => `
            <div class="flex justify-between items-center py-2 border-b border-gray-100 last:border-0 text-sm">
                <div class="text-gray-600 flex-1 pr-4">Q${q.qNum}. ${q.text}</div>
                <div class="font-mono text-blue-600 font-medium">${q.score}</div>
            </div>
        `).join('');

        let containerHtml = `
            <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 break-inside-avoid mb-4">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="text-lg font-bold text-gray-800">${dimName}</h4>
                    <span class="bg-blue-100 text-blue-800 py-1 px-3 rounded-full font-bold">平均: ${dimAvg}</span>
                </div>
                <div class="bg-white p-4 rounded border border-gray-100">
                    ${qHtml}
                </div>
            </div>
        `;

        if (dimIndex < 2) {
            document.getElementById('dims-page-1').insertAdjacentHTML('beforeend', containerHtml);
        } else {
            document.getElementById('dims-page-2').insertAdjacentHTML('beforeend', containerHtml);
        }
    }

    function drawRadarChart(scores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (myChart) { myChart.destroy(); }

        myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['可靠性', '保證性', '有形性', '同理性', '反應性'],
                datasets: [{
                    label: '構面平均分數',
                    data: scores,
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                    pointRadius: 4,
                    pointHoverRadius: 7,
                    pointHitRadius: 40 
                }]
            },
            options: {
                responsive: true,
                interaction: { mode: 'nearest', intersect: false },
                scales: {
                    r: {
                        angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
                        grid: { color: 'rgba(0, 0, 0, 0.1)' },
                        pointLabels: { font: { size: 14, weight: 'bold' }, color: '#374151' },
                        min: 3,         // 固定下限 3
                        max: 5,         // 固定上限 5
                        ticks: { stepSize: 0.5 } // 固定間距 0.5
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function openExportModal() { document.getElementById('exportModal').classList.remove('hidden'); }
    function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }

    function executeExport(type) {
        closeExportModal();
        
        const showRadar = document.getElementById('checkRadar').checked;
        const showScores = document.getElementById('checkScores').checked;

        if (!showRadar && !showScores) {
            alert('請至少勾選一項匯出內容！');
            return;
        }

        const reportEl = document.getElementById('reportContainer');
        const exportContent = document.getElementById('exportContent');
        const radarSection = document.getElementById('section-radar');
        const scoresSection1 = document.getElementById('section-scores-1');
        const scoresSection2 = document.getElementById('section-scores-2');

        radarSection.classList.remove('hidden');
        scoresSection1.classList.remove('hidden');
        scoresSection2.classList.remove('hidden');
        scoresSection1.classList.remove('pdf-page-break');
        scoresSection2.classList.remove('pdf-page-break');
        scoresSection2.classList.add('mt-8');

        if (!showRadar) radarSection.classList.add('hidden');
        if (!showScores) {
            scoresSection1.classList.add('hidden');
            scoresSection2.classList.add('hidden');
        }

        if (type === 'pdf') {
            if (showRadar && showScores) {
                scoresSection1.classList.add('pdf-page-break');
                scoresSection2.classList.add('pdf-page-break');
                scoresSection2.classList.remove('mt-8'); 
            } else if (!showRadar && showScores) {
                scoresSection2.classList.add('pdf-page-break');
                scoresSection2.classList.remove('mt-8'); 
            }
        }

        window.scrollTo(0, 0); 

        if (type === 'pdf') {
            const opt = {
                margin:       10, 
                filename:     '服務品質滿意度分析報表.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'], before: '.pdf-page-break' } 
            };

            html2pdf().set(opt).from(exportContent).save().then(() => restoreVisibility());
        } 
        else if (type === 'png') {
            html2canvas(reportEl, { scale: 2, scrollY: 0, backgroundColor: "#ffffff" }).then(canvas => {
                let link = document.createElement('a');
                link.download = '服務品質滿意度分析報表.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                restoreVisibility();
            });
        }

        function restoreVisibility() {
            radarSection.classList.remove('hidden');
            scoresSection1.classList.remove('hidden');
            scoresSection2.classList.remove('hidden');
            scoresSection1.classList.remove('pdf-page-break');
            scoresSection2.classList.remove('pdf-page-break');
            scoresSection2.classList.add('mt-8');
        }
    }

    function downloadCSV() {
        if (globalResults.length === 0) return;
        let csvContent = "\uFEFF構面名稱,構面平均得分,題號,題目內容,逐題平均得分\n";
        globalResults.forEach(dim => {
            dim.questions.forEach(q => {
                csvContent += `${dim.dimension},${dim.avg},Q${q.qNum},"${q.text}",${q.score}\n`;
            });
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "滿意度分析數據.csv";
        link.click();
    }
</script>

</body>
</html>
